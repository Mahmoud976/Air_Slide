name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "airslide.py"
      - "requirements.txt"
      - "requirements-build.txt"
      - "build_exe.bat"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify build requirements exist
        shell: pwsh
        run: |
          if (-not (Test-Path "requirements-build.txt")) {
            Write-Error "requirements-build.txt is missing from the checked-out commit."
            Get-ChildItem -Force
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build single-file application
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AirSlide --collect-all mediapipe --collect-all cv2 --collect-all numpy --collect-all pyautogui airslide.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSlide-Windows
          path: dist/AirSlide.exe
          if-no-files-found: error
          retention-days: 14
